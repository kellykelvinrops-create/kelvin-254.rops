<!DOCTYPE html>
<html>
<head>
<title>Gallery</title>
<style>
body{margin:0; font-family:sans-serif; background:#999; text-align:center;}
.top{background:#e91e63; color:white; padding:15px; font-weight:bold;}
.card{background:#aaa; width:600px; margin:40px auto; padding:20px; border-radius:20px;}
img{width:150px; height:150px; object-fit:cover; border-radius:15px; margin:10px; cursor:pointer; transition:0.3s;}
img:hover{transform:scale(1.1);}
a.btn{background:#e91e63; color:white; padding:10px 15px; border-radius:20px; text-decoration:none; display:inline-block; margin-top:20px;}
</style>
</head>
<body>
<div class="top">My Gallery</div>
<div class="card">
<h2 style="color:white;">Click an image to open</h2>

<a href="html.jpg" target="_blank"><img src="html.jpg"></a>

<a href="tulip.jpg" target="_blank"><img src="tulip.jpg"></a>

<br>
<a class="btn" href="hello.html">Back to Home</a>
</div>
</body>
</html>
